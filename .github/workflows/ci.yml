name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build solution
        run: msbuild -restore "DarkCloud-Enhanced.sln" /p:Configuration=Release /p:Platform=x64 /p:RestoreLockedMode=true /verbosity:minimal

      - name: Run all tests
        run: dotnet test "DarkCloud-Enhanced.sln" -c Release --no-build

      - name: Upload legacy host artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DarkCloud-Enhanced-Mod-Legacy-Windows
          path: "src/DarkCloudEnhancedMod/bin/Release"

      - name: Upload modern host artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DarkCloud-Enhanced-Mod-Modern-Windows
          path: "src/DarkCloud.App.WinForms/bin/Release/net8.0-windows"

  build-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Mono and runtime tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mono-runtime mono-mcs gcc python3 libgdiplus

      - name: Restore dependencies (locked)
        run: dotnet restore "DarkCloud-Enhanced.sln" --locked-mode

      - name: Run Core and Memory Abstractions tests
        run: |
          dotnet test "tests/DarkCloud.Core.Tests/DarkCloud.Core.Tests.csproj" -c Release --no-restore
          dotnet test "tests/DarkCloud.Memory.Abstractions.Tests/DarkCloud.Memory.Abstractions.Tests.csproj" -c Release --no-restore

      - name: Run integration tests
        run: |
          dotnet test "tests/DarkCloudEnhancedMod.IntegrationTests/DarkCloudEnhancedMod.IntegrationTests.csproj" -c Release --no-restore
          dotnet test "tests/DarkCloud.Memory.Windows.IntegrationTests/DarkCloud.Memory.Windows.IntegrationTests.csproj" -c Release --no-restore

      - name: Build hosts
        run: |
          dotnet build "src/DarkCloudEnhancedMod/DarkCloudEnhancedMod.csproj" -c Release --no-restore
          dotnet build "src/DarkCloud.App.WinForms/DarkCloud.App.WinForms.csproj" -c Release --no-restore

      - name: Verify generated files are current
        run: |
          dotnet run --project tools/AddressGenerator/AddressGenerator.csproj -- data/addresses.json src/DarkCloud.Memory.Abstractions/Generated/GameAddresses.g.cs
          git diff --exit-code src/DarkCloud.Memory.Abstractions/Generated/

      - name: Run PAL port CI tests
        run: |
          mkdir -p test-results
          python3 tests/pal/test_pal.py 2>&1 | tee test-results/pal-test.log

      - name: Run Linux memory smoke test
        run: tests/linux_smoke/run.sh 2>&1 | tee test-results/linux-smoke.log

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

      - name: Upload legacy host artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DarkCloud-Enhanced-Mod-Legacy-Linux
          path: "src/DarkCloudEnhancedMod/bin/Release"

      - name: Upload modern host artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DarkCloud-Enhanced-Mod-Modern-Linux
          path: "src/DarkCloud.App.WinForms/bin/Release/net8.0-windows"
