name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build solution
        run: msbuild -restore "DarkCloud-Enhanced.sln" /p:Configuration=Release /p:Platform=x64 /p:RestoreLockedMode=true /verbosity:minimal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DarkCloud-Enhanced-Mod-Windows
          path: "src/DarkCloudEnhancedMod/bin/Release"

  build-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Mono and runtime tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mono-runtime mono-mcs gcc python3 libgdiplus

      - name: Restore dependencies (locked)
        run: |
          dotnet restore "src/DarkCloudEnhancedMod/DarkCloudEnhancedMod.csproj" --locked-mode
          dotnet restore "tests/DarkCloud.Memory.Abstractions.Tests/DarkCloud.Memory.Abstractions.Tests.csproj" --locked-mode
          dotnet restore "tests/DarkCloud.Memory.ContractTests/DarkCloud.Memory.ContractTests.csproj" --locked-mode

      - name: Build C# project
        run: dotnet build "src/DarkCloudEnhancedMod/DarkCloudEnhancedMod.csproj" -c Release --no-restore

      - name: Run unit tests
        run: |
          dotnet test "tests/DarkCloud.Memory.Abstractions.Tests/DarkCloud.Memory.Abstractions.Tests.csproj" --no-restore
          dotnet test "tests/DarkCloud.Memory.ContractTests/DarkCloud.Memory.ContractTests.csproj" --no-restore

      - name: Verify generated files are current
        run: |
          dotnet run --project tools/AddressGenerator/AddressGenerator.csproj -- data/addresses.json src/DarkCloud.Memory.Abstractions/Generated/GameAddresses.g.cs
          git diff --exit-code src/DarkCloud.Memory.Abstractions/Generated/

      - name: Run PAL port CI tests
        run: |
          mkdir -p test-results
          python3 tests/pal/test_pal.py 2>&1 | tee test-results/pal-test.log

      - name: Run Linux memory smoke test
        run: tests/linux_smoke/run.sh 2>&1 | tee test-results/linux-smoke.log

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DarkCloud-Enhanced-Mod-Linux
          path: "src/DarkCloudEnhancedMod/bin/Release"

  release:
    name: Create GitHub Release
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: DarkCloud-Enhanced-Mod-Windows
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: DarkCloud-Enhanced-Mod-Linux
          path: artifacts/linux

      - name: Package release zips
        run: |
          tag="${{ github.ref_name }}"
          for platform in windows linux; do
            mkdir -p "staging/$platform"
            find "artifacts/$platform" -type f ! -name '*.pdb' ! -name '*.mdb' ! -name '*.xml' -print0 |
              while IFS= read -r -d '' file; do
                rel="${file#artifacts/$platform/}"
                dest="staging/$platform/$rel"
                mkdir -p "$(dirname "$dest")"
                cp "$file" "$dest"
              done
            (cd "staging/$platform" && zip -r "../../DarkCloud-Enhanced-Mod-${tag}-${platform}.zip" .)
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DarkCloud-Enhanced-Mod-${{ github.ref_name }}-*.zip
          generate_release_notes: true
