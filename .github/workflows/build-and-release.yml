name: Build and Release

permissions:
  contents: write

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild -restore "DarkCloud-Enhanced.sln" /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DarkCloud-Enhanced-Mod-Release
          path: "src/DarkCloudEnhancedMod/bin/Release"

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "DarkCloud-Enhanced-Mod-$tag.zip"
          Push-Location "src/DarkCloudEnhancedMod/bin/Release"
          Compress-Archive -Path * -DestinationPath (Join-Path $Env:GITHUB_WORKSPACE $zipName) -Force
          Pop-Location
          Write-Output "Created $zipName"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: DarkCloud-Enhanced-Mod-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Mono and runtime tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mono-runtime mono-mcs gcc python3 libgdiplus

      - name: Build C# project
        run: dotnet build "src/DarkCloudEnhancedMod/DarkCloudEnhancedMod.csproj" -c Release

      - name: AOT compile for verification
        run: mono --aot "src/DarkCloudEnhancedMod/bin/Release/DarkCloudEnhancedMod.exe"

      - name: Run PAL port CI tests
        run: python3 tests/pal/test_pal.py

      - name: Run Linux memory smoke test
        run: tests/linux_smoke/run.sh

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DarkCloud-Enhanced-Mod-Linux
          path: "src/DarkCloudEnhancedMod/bin/Release"
