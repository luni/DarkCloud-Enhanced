name: Build and Release

permissions:
  contents: write

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild -restore "DarkCloud-Enhanced.sln" /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DarkCloud-Enhanced-Mod-Windows
          path: "src/DarkCloudEnhancedMod/bin/Release"

  build-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Mono and runtime tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mono-runtime mono-mcs gcc python3 libgdiplus

      - name: Build C# project
        run: dotnet build "src/DarkCloudEnhancedMod/DarkCloudEnhancedMod.csproj" -c Release

      - name: Run PAL port CI tests
        run: python3 tests/pal/test_pal.py

      - name: Run Linux memory smoke test
        run: tests/linux_smoke/run.sh

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DarkCloud-Enhanced-Mod-Linux
          path: "src/DarkCloudEnhancedMod/bin/Release"

  release:
    name: Create GitHub Release
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: DarkCloud-Enhanced-Mod-Windows
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: DarkCloud-Enhanced-Mod-Linux
          path: artifacts/linux

      - name: Package release zips
        run: |
          tag="${{ github.ref_name }}"
          for platform in windows linux; do
            mkdir -p "staging/$platform"
            # Copy all files except debug symbols and XML docs.
            find "artifacts/$platform" -type f ! -name '*.pdb' ! -name '*.mdb' ! -name '*.xml' -print0 |
              while IFS= read -r -d '' file; do
                rel="${file#artifacts/$platform/}"
                dest="staging/$platform/$rel"
                mkdir -p "$(dirname "$dest")"
                cp "$file" "$dest"
              done
            (cd "staging/$platform" && zip -r "../../DarkCloud-Enhanced-Mod-${tag}-${platform}.zip" .)
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DarkCloud-Enhanced-Mod-${{ github.ref_name }}-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
